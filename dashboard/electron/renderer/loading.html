<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Starting DRS dashboard</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #090b10;
      color: #f8fafc;
      font-family: Inter, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }
    main { text-align: center; max-width: 520px; padding: 24px; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Starting DRS dashboard</h1>
    <p id="detail">Starting DRS engine...</p>
  </main>
  <script>
    // The detail line is passed via the URL hash so the same static file can
    // show each startup stage without a data: URL navigation.
    var detail = decodeURIComponent((location.hash || "").slice(1));
    if (detail) document.getElementById("detail").textContent = detail;
  </script>
</body>
</html>
