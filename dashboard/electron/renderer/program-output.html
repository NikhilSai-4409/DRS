<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DRS TV Output</title>
<style>
  /* TV Output — the clean review screen the operator's streaming application
     captures (Window Capture of "DRS TV Output") and cuts to during a review.
     NO controls live here: the flow is AUTOMATIC, driven by the dashboard over
     the program-command IPC relay — appeal starts -> UltraEdge replay plays;
     pipeline replay video arrives -> it plays; operator confirms -> verdict
     banner, then back to live. The audience only ever sees this frame. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden;
    font-family:"Segoe UI", Arial, sans-serif; }
  #stagewrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:1920px; height:1080px; background:#000;
    transform-origin:center center; flex:none; overflow:hidden; }
  #vid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #pvid { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    background:#000; display:none; }

  .chip { position:absolute; top:42px; left:48px; display:flex; align-items:center; gap:14px;
    background:linear-gradient(180deg, rgba(8,20,34,.92), rgba(4,12,22,.92));
    border:1px solid rgba(160,200,225,.35); border-radius:4px;
    padding:12px 22px; color:#eaf4fb; font-size:26px; font-weight:600; letter-spacing:2px; }
  .chip .dot { width:14px; height:14px; border-radius:50%; background:#ff3b3b;
    box-shadow:0 0 10px #ff3b3b; }
  .chip small { font-weight:400; font-size:20px; color:#9fc0d5; letter-spacing:1px; }

  #status { position:absolute; left:50%; bottom:24px; transform:translateX(-50%);
    background:rgba(4,12,22,.85); border:1px solid rgba(160,200,225,.3); border-radius:4px;
    color:#9fc0d5; font-size:20px; letter-spacing:1px; padding:10px 24px; }
  #status[hidden] { display:none; }

  /* ===== UltraEdge panel ===== */
  #ue { position:absolute; left:50%; transform:translateX(-50%); bottom:56px; width:1180px; display:none; }
  #ue .tab { display:inline-block; position:relative; z-index:2;
    background:linear-gradient(180deg,#46cede 0%, #1b7f9e 30%, #053e54 100%);
    color:#fff; font-size:30px; font-weight:700; font-style:italic;
    letter-spacing:4px; padding:10px 34px 8px 30px; border-radius:5px 5px 0 0;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    border:1px solid rgba(190,230,245,.5); border-bottom:none; }
  #ue .box { position:relative; overflow:hidden; transform-origin:top left;
    background:linear-gradient(180deg, rgba(5,14,24,.93), rgba(2,8,16,.95));
    border:1px solid rgba(200,228,240,.55); border-radius:0 6px 6px 6px;
    height:196px; box-shadow:0 10px 40px rgba(0,0,0,.55); }
  #wave { position:absolute; inset:0; width:100%; height:100%; }
  #flash { position:absolute; inset:0; background:#eaf8ff; opacity:0; pointer-events:none; }
  #sheen { position:absolute; inset:0; pointer-events:none; transform:translateX(-110%);
    background:linear-gradient(105deg, transparent 42%, rgba(190,230,250,.20) 50%, transparent 58%); }
  #ue-note { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:#9fc0d5; font-size:22px; letter-spacing:1px; text-align:center; padding:0 40px; }

  #ue.enter .tab { animation:ue-tab .28s ease-out both; }
  #ue.enter .box { animation:ue-box .34s ease-out .10s both; }
  #ue.enter #sheen { animation:ue-sheen .85s ease-out .32s both; }
  @keyframes ue-tab { from { opacity:0; transform:translateX(-40px); } to { opacity:1; transform:none; } }
  @keyframes ue-box { from { opacity:0; transform:scaleY(.06); } to { opacity:1; transform:scaleY(1); } }
  @keyframes ue-sheen { to { transform:translateX(110%); } }
  #ue .box.punch { animation:ue-punch .24s ease-out; }
  @keyframes ue-punch { 0%{transform:scale(1)} 40%{transform:scale(1.03)} 100%{transform:scale(1)} }
  #flash.go { animation:ue-flash .3s ease-out both; }
  @keyframes ue-flash { 0%{opacity:.55} 100%{opacity:0} }

  /* ===== Decision scene ===== */
  #decision { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:44px; background:rgba(2,8,16,.55); }
  .dcards { display:flex; gap:26px; }
  .dcard { width:330px; border-radius:8px; overflow:hidden;
    border:1px solid rgba(190,230,245,.45); box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .dcard .h { background:linear-gradient(180deg,#46cede,#053e54); color:#fff;
    font-size:24px; font-weight:700; letter-spacing:2px; text-align:center; padding:14px 6px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dcard .v { color:#fff; font-size:28px; font-weight:800; letter-spacing:1px;
    text-align:center; padding:20px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:linear-gradient(180deg,#2b5f7d,#0c2c40); }
  .dcard .v.green { background:linear-gradient(180deg,#46d357,#157021); }
  .dcard .v.red   { background:linear-gradient(180deg,#f04b46,#9c0a0d); }
  .banner { color:#fff; font-size:84px; font-weight:900; letter-spacing:14px; padding:26px 130px;
    border-radius:10px; border:1px solid rgba(220,255,225,.5);
    box-shadow:0 16px 60px rgba(0,0,0,.65); text-shadow:0 2px 8px rgba(0,0,0,.4);
    background:linear-gradient(180deg,#2b5f7d,#0c2c40); }
  .banner.green { background:linear-gradient(180deg,#46d357,#157021); }
  .banner.red { background:linear-gradient(180deg,#f04b46,#9c0a0d); }
  #decision.enter .dcard { animation:card-pop .38s cubic-bezier(.2,1.4,.4,1) both; }
  #decision.enter .dcard:nth-child(1){animation-delay:.05s} #decision.enter .dcard:nth-child(2){animation-delay:.17s}
  #decision.enter .dcard:nth-child(3){animation-delay:.29s} #decision.enter .dcard:nth-child(4){animation-delay:.41s}
  #decision.enter .banner { animation:banner-rise .5s ease-out .6s both; }
  @keyframes card-pop { from { opacity:0; transform:translateY(26px) scale(.85); } to { opacity:1; transform:none; } }
  @keyframes banner-rise { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div id="stagewrap">
  <div id="stage">
    <img id="vid" alt="">
    <video id="pvid" muted playsinline></video>
    <div class="chip"><span class="dot"></span><span id="chip-main">LIVE</span>&nbsp;<small id="chip-sub"></small></div>
    <div id="ue">
      <span class="tab">ULTRA&nbsp;EDGE</span>
      <div class="box">
        <canvas id="wave" width="1178" height="196"></canvas>
        <div id="sheen"></div>
        <div id="flash"></div>
        <div id="ue-note"></div>
      </div>
    </div>
    <div id="decision"><div class="dcards" id="dcards"></div><div class="banner" id="banner"></div></div>
    <div id="status" hidden></div>
  </div>
</div>

<script>
"use strict";
const API_BASE = "http://localhost:8765";
const CLIP_HALF = 18;          // frames either side of the impact in the UltraEdge clip
const BPF = 10;                // waveform buckets per replay frame

const els = {
  stage: document.getElementById("stage"),
  vid: document.getElementById("vid"),
  pvid: document.getElementById("pvid"),
  chipMain: document.getElementById("chip-main"),
  chipSub: document.getElementById("chip-sub"),
  status: document.getElementById("status"),
  ue: document.getElementById("ue"),
  box: document.querySelector("#ue .box"),
  wave: document.getElementById("wave"),
  flash: document.getElementById("flash"),
  ueNote: document.getElementById("ue-note"),
  decision: document.getElementById("decision"),
  dcards: document.getElementById("dcards"),
  banner: document.getElementById("banner"),
};
const cx = els.wave.getContext("2d");

const state = {
  scene: "live",
  liveCam: 0,
  liveTimer: null,
  decision: null,
  confirmedOutcome: null,
  decisionTimer: null,
  clip: null,       // { urls[], n, impact, spikes:Set, buckets[[lo,hi]], reason }
  idx: 0, maxIdx: 0, seg: 0, playing: false,
  holdUntil: 0, nextStepAt: 0, spikeT: -1e9, markerT: -1e9,
};

function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  els.stage.style.transform = `scale(${s})`;
}
window.addEventListener("resize", fit);
fit();

function setStatus(text) {
  els.status.hidden = !text;
  if (text) els.status.textContent = text;
}

/* ---------- LIVE scene ---------- */
function startLive() {
  stopLive();
  const tickLive = () => {
    if (state.scene !== "live") return;
    els.vid.src = `${API_BASE}/api/live/${state.liveCam}.jpg?t=${Date.now()}`;
  };
  state.liveTimer = setInterval(tickLive, 200);
  tickLive();
}
function stopLive() {
  if (state.liveTimer) { clearInterval(state.liveTimer); state.liveTimer = null; }
}
els.vid.addEventListener("error", () => {
  els.vid.style.visibility = "hidden";
  if (state.scene === "live") setStatus("No live frame — is the backend running?");
});
els.vid.addEventListener("load", () => {
  els.vid.style.visibility = "visible";
  if (state.scene === "live") setStatus(null);
});

/* ---------- UltraEdge clip loading (auto-plays when done) ---------- */
async function loadReview(payload) {
  state.decision = payload.decision || null;
  state.confirmedOutcome = null;
  const win = payload.window || {};
  const cam = payload.cameraId != null ? payload.cameraId : 0;
  const total = win.total_frames || 0;
  const start = win.start_timestamp_ms;
  const end = win.end_timestamp_ms;
  state.clip = null;
  if (!total || start == null || end == null || end <= start) {
    state.clip = { urls: [], n: 0, impact: null, spikes: new Set(), buckets: [],
                   reason: "no frozen replay window for this review" };
    setScene("ultraedge");
    return;
  }
  const events = (state.decision && state.decision.edge_analysis && state.decision.edge_analysis.events) || [];
  const batEvents = events.filter((e) => e.is_bat);
  const ranked = (batEvents.length ? batEvents : events)
    .slice().sort((a, b) => (b.label_confidence || b.confidence || 0) - (a.label_confidence || a.confidence || 0));
  const impactGlobal = ranked.length ? (ranked[0].frame_id ?? ranked[0].frame ?? null) : null;
  const centre = impactGlobal != null ? impactGlobal : Math.floor(total / 2);
  const lo = Math.max(0, centre - CLIP_HALF);
  const hi = Math.min(total - 1, centre + CLIP_HALF);
  const n = hi - lo + 1;
  const span = end - start;
  const clipStartMs = start + (lo / total) * span;
  const clipEndMs = start + ((hi + 1) / total) * span;

  let buckets = [], waveReason = null;
  try {
    const resp = await fetch(`${API_BASE}/api/audio/waveform?start_ms=${clipStartMs}&end_ms=${clipEndMs}&buckets=${n * BPF}`);
    const wf = await resp.json();
    if (wf.available) buckets = wf.buckets;
    else waveReason = wf.reason || "no audio for this window";
  } catch { waveReason = "waveform unavailable — backend unreachable"; }

  const urls = new Array(n).fill(null);
  await Promise.all(Array.from({ length: n }, async (_, i) => {
    try {
      const r = await fetch(`${API_BASE}/api/replay/${cam}.jpg?frame_index=${lo + i}`);
      if (r.ok) urls[i] = URL.createObjectURL(await r.blob());
    } catch {}
  }));

  const spikes = new Set();
  events.forEach((e) => {
    const f = (e.frame_id ?? e.frame);
    if (f != null && f >= lo && f <= hi) spikes.add(f - lo);
  });
  state.clip = {
    urls, n,
    impact: impactGlobal != null ? impactGlobal - lo : null,
    spikes, buckets, reason: waveReason,
  };
  setScene("ultraedge");   // review is in — the audience sees it immediately
}

/* ---------- UltraEdge playback (broadcast sequence, loops) ---------- */
function buildSeq() {
  const c = state.clip;
  if (!c || c.impact == null) return [{ to: (c ? c.n : 1) - 1, fps: 8 }];
  return [
    { to: Math.min(c.n - 1, c.impact + 4), fps: 8, impactHold: 800 },
    { to: Math.max(0, c.impact - 5), fps: 14 },
    { to: Math.min(c.n - 1, c.impact + 4), fps: 5, impactHold: 650 },
    { to: c.n - 1, fps: 8 },
  ];
}

function drawWave() {
  const c = state.clip;
  if (!c) return;
  const now = Date.now();
  const W = els.wave.width, H = els.wave.height, PADX = 26;
  const plotW = W - PADX * 2, mid = H / 2, amp = H * 0.42;
  cx.clearRect(0, 0, W, H);
  cx.strokeStyle = "rgba(140,175,195,0.28)"; cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(PADX, mid); cx.lineTo(W - PADX, mid); cx.stroke();
  cx.strokeStyle = "rgba(140,175,195,0.16)";
  for (let i = 0; i <= c.n; i++) {
    const x = PADX + plotW * i / c.n;
    cx.beginPath(); cx.moveTo(x, H - 10); cx.lineTo(x, H - 4); cx.stroke();
  }
  if (!c.buckets.length) return drawCursor(plotW, PADX, H);
  const fw = plotW / c.n;
  const glow = Math.max(0, 1 - (now - state.spikeT) / 900);
  const bw = fw / BPF;
  for (let f = 0; f <= state.maxIdx && f < c.n; f++) {
    const spike = c.spikes.has(f);
    cx.strokeStyle = spike ? "#7df0ff" : "rgba(238,248,252,0.92)";
    cx.shadowColor = spike ? "rgba(90,220,250,0.9)" : "transparent";
    cx.shadowBlur = spike ? 8 + 16 * glow : 0;
    cx.lineWidth = Math.max(1.4, bw * 0.55);
    cx.beginPath();
    for (let b = 0; b < BPF; b++) {
      const pair = c.buckets[f * BPF + b];
      if (!pair) continue;
      const x = PADX + fw * f + bw * (b + 0.5);
      cx.moveTo(x, mid - pair[1] * amp - 0.75);
      cx.lineTo(x, mid - pair[0] * amp + 0.75);
    }
    cx.stroke();
  }
  cx.shadowBlur = 0;
  if (c.impact != null && state.maxIdx >= c.impact) {
    const k = Math.min(1, (now - state.markerT) / 260);
    const s = k < 1 ? (1.25 - 0.25 * k) * k * (2 - k) : 1;
    if (s > 0.01) {
      const sx = PADX + fw * c.impact + fw * 0.5;
      cx.fillStyle = "#ff5252";
      cx.beginPath();
      cx.moveTo(sx, H - 24 * s - 10 * (1 - s));
      cx.lineTo(sx - 8 * s, H - 10); cx.lineTo(sx + 8 * s, H - 10);
      cx.closePath(); cx.fill();
    }
  }
  drawCursor(plotW, PADX, H);
}
function drawCursor(plotW, PADX, H) {
  const c = state.clip;
  const x = PADX + (plotW / c.n) * (state.idx + 1);
  cx.strokeStyle = "#ffffff"; cx.lineWidth = 2.4;
  cx.beginPath(); cx.moveTo(x, 8); cx.lineTo(x, H - 8); cx.stroke();
  cx.fillStyle = "#ffffff";
  cx.beginPath(); cx.moveTo(x - 6, 8); cx.lineTo(x + 6, 8); cx.lineTo(x, 17); cx.closePath(); cx.fill();
}

function showFrame() {
  const c = state.clip;
  if (!c || !c.n) return;
  if (c.urls[state.idx]) els.vid.src = c.urls[state.idx];
  drawWave();
}

function spikeFx() {
  state.spikeT = Date.now();
  if (state.markerT < 0) state.markerT = state.spikeT;
  els.box.classList.remove("punch"); void els.box.offsetWidth; els.box.classList.add("punch");
  els.flash.classList.remove("go"); void els.flash.offsetWidth; els.flash.classList.add("go");
}

function restartLoop() {
  state.idx = 0; state.maxIdx = 0; state.seg = 0;
  state.spikeT = -1e9; state.markerT = -1e9;
}

function tick() {
  if (state.scene !== "ultraedge" || !state.clip || !state.clip.n) return;
  const now = Date.now();
  if (now - state.spikeT < 950 || now - state.markerT < 300) drawWave();
  if (!state.playing) return;
  if (now < state.holdUntil || now < state.nextStepAt) return;
  const seq = buildSeq();
  const s = seq[Math.min(state.seg, seq.length - 1)];
  const dir = s.to >= state.idx ? 1 : -1;
  state.idx += dir;
  state.maxIdx = Math.max(state.maxIdx, state.idx);
  state.nextStepAt = now + 1000 / s.fps;
  if (dir > 0 && state.clip.impact != null && state.idx === state.clip.impact && s.impactHold) {
    state.holdUntil = now + s.impactHold;
    spikeFx();
  }
  if (state.idx === s.to) {
    state.seg++;
    if (state.seg >= seq.length) {
      state.holdUntil = now + 1100;
      restartLoop();
      showFrame();
      return;
    }
  }
  showFrame();
}
setInterval(tick, 20);

function enterUltraEdge() {
  const c = state.clip;
  els.ue.style.display = "block";
  if (!c) {
    els.ueNote.style.display = "flex";
    els.ueNote.textContent = "Waiting for a review…";
    return;
  }
  els.ueNote.style.display = c.reason && !c.buckets.length ? "flex" : "none";
  if (c.reason && !c.buckets.length) els.ueNote.textContent = c.reason;
  restartLoop();
  state.playing = true;
  els.ue.classList.remove("enter"); void els.ue.offsetWidth; els.ue.classList.add("enter");
  state.holdUntil = Date.now() + 750;
  showFrame();
}

/* ---------- Decision scene ---------- */
const GREEN = ["NOT OUT", "NOT_OUT", "MISSING", "NO BAT", "LEGAL", "NONE", "CLEAR"];
const RED = ["OUT", "IN LINE", "IN-LINE", "HITTING", "NO BALL", "BAT", "WIDE"];
function verdictClass(text) {
  const t = String(text || "").toUpperCase();
  if (GREEN.some((g) => t.includes(g))) return "green";
  if (RED.some((r) => t.includes(r))) return "red";
  return "";
}
function renderDecisionScene() {
  const d = state.decision || {};
  const rr = d.review_result || {};
  const verdict = state.confirmedOutcome || rr.verdict || d.status || "—";
  els.banner.textContent = String(verdict).replace(/_/g, " ");
  els.banner.className = `banner ${verdictClass(verdict)}`;
  const rows = (rr.measurements || []).slice(0, 4);
  els.dcards.innerHTML = "";
  rows.forEach((m) => {
    const label = m.label || m.name || "";
    const value = m.value != null ? m.value : (m.status != null ? m.status : "—");
    const card = document.createElement("div");
    card.className = "dcard";
    const h = document.createElement("div"); h.className = "h"; h.textContent = String(label).toUpperCase();
    const v = document.createElement("div"); v.className = `v ${verdictClass(value)}`; v.textContent = String(value).toUpperCase();
    card.appendChild(h); card.appendChild(v);
    els.dcards.appendChild(card);
  });
  els.decision.classList.remove("enter"); void els.decision.offsetWidth; els.decision.classList.add("enter");
}

/* ---------- pipeline replay video scene ---------- */
els.pvid.addEventListener("ended", () => {
  // after the ball-tracking replay, settle back on the UltraEdge loop (or live)
  setScene(state.clip && state.clip.n ? "ultraedge" : "live");
});
els.pvid.addEventListener("error", () => {
  setScene(state.clip && state.clip.n ? "ultraedge" : "live");
});

/* ---------- scene switching (driven by the dashboard, fully automatic) ---------- */
function setScene(scene) {
  state.scene = scene;
  stopLive();
  clearTimeout(state.decisionTimer);
  els.ue.style.display = "none";
  els.decision.style.display = "none";
  els.pvid.style.display = "none";
  els.pvid.pause();
  els.vid.style.display = scene === "video" ? "none" : "block";
  setStatus(null);
  if (scene === "live") {
    els.chipMain.textContent = "LIVE";
    els.chipSub.textContent = "";
    startLive();
  } else if (scene === "ultraedge") {
    els.chipMain.textContent = "DRS REVIEW";
    els.chipSub.textContent = `${reviewTypeLabel()} · ULTRAEDGE`;
    enterUltraEdge();
  } else if (scene === "decision") {
    els.chipMain.textContent = "DRS REVIEW";
    els.chipSub.textContent = `${reviewTypeLabel()} · DECISION`;
    els.decision.style.display = "flex";
    renderDecisionScene();
    state.decisionTimer = setTimeout(() => setScene("live"), 6500);
  } else if (scene === "video") {
    els.chipMain.textContent = "DRS REVIEW";
    els.chipSub.textContent = `${reviewTypeLabel()} · BALL TRACKING`;
    els.pvid.style.display = "block";
    els.pvid.play().catch(() => {});
  }
}
function reviewTypeLabel() {
  return String(state.decision?.review_type || "REVIEW").toUpperCase().replace(/_/g, " ");
}

/* ---------- commands from the dashboard ---------- */
function handleCommand(cmd) {
  if (!cmd || !cmd.type) return;
  switch (cmd.type) {
    case "live-config":
      if (cmd.cameraId != null) state.liveCam = cmd.cameraId;
      if (state.scene === "live") startLive();
      break;
    case "load":          // appeal in -> loadReview() auto-plays the UltraEdge scene
      loadReview(cmd);
      break;
    case "replay-video":  // pipeline ball-tracking replay is ready -> play it once
      if (cmd.url) { els.pvid.src = cmd.url; setScene("video"); }
      break;
    case "decision":      // operator confirmed -> verdict banner, then back to live
      state.confirmedOutcome = cmd.outcome || null;
      setScene("decision");
      break;
    case "live":
      setScene("live");
      break;
  }
}
window.drs?.onProgramCommand?.(handleCommand);
setScene("live");
</script>
</body>
</html>
